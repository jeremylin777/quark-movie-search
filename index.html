<script>
/* ============================================================
 * 夸克影视搜 - 纯前端夸克网盘影视资源搜索
 * 数据源: 泽索搜 https://zreso.cn (公开 JSON API, 免 Key)
 * 说明: 泽索搜 API 本身不开放 CORS, 前端通过公共 CORS 代理转发
 * ============================================================ */

// ---- CORS 代理列表(按优先级, 失败自动降级) ----
// 已部署 Cloudflare Worker 专属代理, 见同目录 worker.js
const CUSTOM_PROXY = 'https://quark-movie-proxy.quark-movie-proxy.workers.dev';   // 专属代理
const PROXIES = [
  ...(CUSTOM_PROXY ? [u => CUSTOM_PROXY + '/?url=' + encodeURIComponent(u)] : []),
  u => 'https://cors.eu.org/' + u,
  u => u, // 最后尝试直连(万一源站允许)
];
const API_BASE = 'https://zreso.cn';
const TIMEOUT_FIRST = 10000;  // 首个代理超时 ms (专属代理快)
const TIMEOUT_FALLBACK = 8000; // 备用代理超时 ms (快速降级)

// ---- 状态映射 ----
const CLOUD_MAP = {
  quark:  { name: '夸克网盘', cls: 'quark' },
  baidu:  { name: '百度网盘', cls: 'baidu' },
  xunlei: { name: '迅雷网盘', cls: 'xunlei' },
  uc:     { name: 'UC网盘',   cls: 'uc' },
  aliyun: { name: '阿里云盘', cls: 'baidu' },
  '115':  { name: '115网盘',  cls: 'uc' },
  tianyi: { name: '天翼云盘', cls: 'uc' },
};

// ---- 状态 ----
let allResults = [];
let activeFilter = 'all';
let activeSort = 'time';
let lastKeyword = '';
let visibleCount = 60;            // 当前渲染条数(分页)
const RENDER_BATCH = 60;          // 每次渲染/加载的条数
let searchSeq = 0;                // 搜索请求序号(防竞态)
let mergeSame = false;            // 是否合并同名多版本
let expandedGroups = new Set();   // 已展开的合并组(核心名集合)
let resolvingMap = {};   // t -> Promise 防止重复解析
const linkCache = {};    // t -> raw_url 内存缓存
let washQueue = Promise.resolve();  // 解析请求全局队列(限流)
const WASH_INTERVAL = 2200;         // 每次解析请求之间的最小间隔 ms
const SEARCH_CACHE_TTL = 10 * 60 * 1000; // 搜索缓存有效期 10 分钟
const CACHE_MAX = 20;              // 缓存最多保留的搜索词数(LRU)

// ---- DOM ----
const $ = s => document.querySelector(s);
const searchInput = $('#searchInput');
const searchBtn = $('#searchBtn');
const statusEl = $('#status');
const filtersEl = $('#filters');
const resultsEl = $('#results');
const toastEl = $('#toast');
const backTop = $('#backTop');

// ---- 工具 ----
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

// 统一代理请求: 自动降级所有代理, 支持 JSON / 文本两种返回
async function fetchViaProxy(url, { asText = false } = {}) {
  let lastErr = null;
  for (let i = 0; i < PROXIES.length; i++) {
    const timeout = i === 0 ? TIMEOUT_FIRST : TIMEOUT_FALLBACK;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(PROXIES[i](url), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) {
        // 尝试从错误响应体读取具体原因 (如限流提示 "获取链接频繁")
        let msg = 'HTTP ' + res.status;
        try {
          const j = await res.json();
          if (j && j.msg) msg = j.msg;
        } catch (_) {}
        const err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return asText ? await res.text() : await res.json();
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
      // 继续尝试下一个代理
    }
  }
  throw lastErr || new Error('所有代理均失败');
}

// 关键词归一化: 去空白/连字符/下划线 + 统一小写, 提高缓存命中率
function normalizeKeyword(k) {
  return String(k || '').replace(/[\s\-_.]+/g, '').toLowerCase();
}

// 搜索缓存: localStorage 10 分钟有效, LRU 最多 20 个词
function getSearchCache(keyword) {
  try {
    const k = 'qk_cache_' + normalizeKeyword(keyword);
    const raw = localStorage.getItem(k);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() - d.ts > SEARCH_CACHE_TTL) { localStorage.removeItem(k); return null; }
    return d.data;
  } catch (_) { return null; }
}
function setSearchCache(keyword, data) {
  try {
    const key = 'qk_cache_' + normalizeKeyword(keyword);
    // LRU 淘汰: 维护访问顺序列表, 超上限删除最旧的
    const keys = JSON.parse(localStorage.getItem('qk_cache_keys') || '[]');
    const idx = keys.indexOf(key);
    if (idx >= 0) keys.splice(idx, 1);
    keys.push(key);
    while (keys.length > CACHE_MAX) {
      const old = keys.shift();
      try { localStorage.removeItem(old); } catch (_) {}
    }
    localStorage.setItem('qk_cache_keys', JSON.stringify(keys));
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch (_) {}
}

// 解析请求排队: 串行执行 + 最小间隔, 避免触发源站限流
function enqueueWash(task) {
  const run = washQueue.then(task, task);
  washQueue = run.catch(() => {}).then(() => new Promise(r => setTimeout(r, WASH_INTERVAL)));
  return run;
}

// 从详情页 HTML 提取网盘链接 (备用解析通道, 不受 wash 限流影响)
function extractLinksFromDetail(html) {
  const urls = [];
  const re = /https?:\/\/pan\.(?:quark|quanks)\.cn\/s\/[A-Za-z0-9]+/g;
  let m;
  while ((m = re.exec(html)) && urls.length < 3) {
    if (!urls.includes(m[0])) urls.push(m[0]);
  }
  if (!urls.length) {
    const re2 = /https?:\/\/pan\.baidu\.com\/s\/[A-Za-z0-9_-]+/g;
    while ((m = re2.exec(html)) && urls.length < 3) {
      if (!urls.includes(m[0])) urls.push(m[0]);
    }
  }
  return urls;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function cloudType(type) {
  return CLOUD_MAP[type] || { name: (type || '网盘'), cls: 'other' };
}

function isWashUrl(u) { return u && u.indexOf('/api/wash?') !== -1; }

// ---- 提取影片核心名(用于同名多版本合并) ----
// 去掉标题中的修饰成分: 括号内容、年份、分辨率、字幕、大小等
function coreName(title) {
  let t = String(title || '');
  t = t.replace(/【[^】]*】/g, ' ');          // 去掉【】内容
  t = t.replace(/[(\[][^)\]]*[)\]]/g, ' ');  // 去掉 () [] 内容
  t = t.replace(/[《》「」]/g, '');           // 去掉书名号
  t = t.replace(/\b(19|20)\d{2}\b/g, ' ');   // 去掉年份
  t = t.replace(/(4K|2160P?|1080P?|720P?|UHD|REMUX|原盘|蓝光|HDR10?\+?|杜比|全景声|DTSHD|DTS|ATMOS|IMAX|WEB-?DL|BDRIP|中字|内封|内置|硬字幕|双语|特效|字幕|国语|中英|简繁|简中|繁中|无水印|刮削|\d+(\.\d+)?\s*(TB|GB|MB|GiB)\b)/gi, ' ');
  t = t.replace(/(第[一二三四五六七八九十\d]+季|全\d+集|全集)/g, ' ');
  t = t.replace(/[\s\-_·.:：,，、+]+/g, '').trim();
  return t || String(title || '');
}

// ---- 字幕识别规则(从标题关键词判断是否有字幕) ----
// 优先级从高到低, 命中即返回(特效字幕需在双语之前, 因"中英特效"含"中英")
const SUBTITLE_RULES = [
  { type: 'inner',  label: '内封字幕', cls: 'inner',  kw: ['内封', '内嵌字幕', '内置字幕', '硬字幕'] },
  { type: 'effect', label: '特效字幕', cls: 'effect', kw: ['特效字幕', '中英特效', '特效中字'] },
  { type: 'dual',   label: '双语字幕', cls: 'dual',   kw: ['双语', '中英', '简繁英', '双字'] },
  { type: 'zh',     label: '中文字幕', cls: 'inner',  kw: ['中字', '中文字幕', '国语中字', '国配中字', '繁中', '简中', '简繁', '中文'] },
  { type: 'ext',    label: '外挂字幕', cls: 'dual',   kw: ['外挂字幕', '外挂'] },
];
const NOSUB_WORDS = ['无字幕', '生肉', '无字', 'no sub', 'nosub'];

// 解析字幕: 返回 { subtitled, type, label, cls } 或 null
function parseSubtitle(title) {
  const t = String(title || '');
  // 先排除明确无字幕的
  if (NOSUB_WORDS.some(w => t.toLowerCase().includes(w.toLowerCase()))) {
    return { subtitled: false, type: 'nosub', label: '无字幕', cls: 'nosub' };
  }
  for (const rule of SUBTITLE_RULES) {
    if (rule.kw.some(k => t.includes(k))) {
      return { subtitled: true, type: rule.type, label: rule.label, cls: rule.cls };
    }
  }
  return null; // 未知
}

// 是否明确有字幕(优先用预计算的 _sub)
function hasSubtitle(r) {
  const s = r._sub || parseSubtitle(r.title);
  return !!(s && s.subtitled);
}

// ---- 标题质量解析: 分辨率 + 大小 ----
function parseQuality(title) {
  const t = String(title || '').toUpperCase();
  const q = { score: 0, res: null, resCls: '', size: null, sizeStr: '' };

  // 分辨率识别 (权重从高到低)
  if (/(4K|2160P?|UHD|8K|4320P?)/.test(t)) { q.res = '4K'; q.resCls = 'hd4k'; q.score += 100; }
  else if (/(1080P?|FHD|BLURAY|BDRIP|REMUX|蓝光|原盘)/.test(t)) { q.res = '1080P'; q.resCls = 'hd1080'; q.score += 70; }
  else if (/(720P?|HD)/.test(t)) { q.res = '720P'; q.resCls = 'hd720'; q.score += 40; }

  // 大小识别: 数字 + GB/G/TB/MB
  const m = t.match(/(\d+(?:\.\d+)?)\s*(TB|GB|G|GiB|MB|M)\b/i);
  if (m) {
    const num = parseFloat(m[1]);
    const unit = m[2].toUpperCase();
    let mb = 0;
    if (unit.includes('T')) mb = num * 1024 * 1024;
    else if (unit.startsWith('G')) mb = num * 1024;
    else mb = num;
    q.size = mb;
    q.sizeStr = (mb >= 1024 * 1024) ? (mb / 1024 / 1024).toFixed(2) + ' TB'
      : (mb >= 1024) ? (mb / 1024).toFixed(1) + ' GB'
      : Math.round(mb) + ' MB';
    // 大小分数: 越大越好, 峰值约 +60
    q.score += Math.min(60, Math.round(Math.log2(Math.max(256, mb)) * 3.2));
  }

  // 额外质量提示词
  if (/(HDR|DOLBY|杜比|ATMOS|全景声)/.test(t)) q.score += 8;
  if (/(REMUX|原盘|无损)/.test(t)) q.score += 10;
  if (/(高码|高码率)/.test(t)) q.score += 5;

  return q;
}

// 判断资源是否含夸克链接
function hasQuark(r) { return (r.links || []).some(l => l.type === 'quark'); }

// 相关度打分: 标题对关键词的匹配程度
function relevanceScore(r, kw) {
  if (!kw) return 0;
  const title = String(r.title || '').toLowerCase();
  const k = kw.toLowerCase();
  let s = 0;
  if (title === k) s = 100;                        // 完全相等
  else if (title.startsWith(k)) s = 80;            // 开头匹配
  else if (title.includes(k)) s = 60;              // 包含
  else {
    // 分词匹配: 关键词按空格/常见分隔拆
    const parts = k.split(/[\s,.，。、\-+ ]/).filter(Boolean);
    if (parts.length > 1) {
      const hit = parts.filter(p => title.includes(p)).length;
      s = 20 + hit / parts.length * 40;
    }
  }
  return s;
}

// 统一排序: 返回排序后的结果数组
function sortResults(items) {
  const arr = items.slice();
  const kw = lastKeyword;
  switch (activeSort) {
    case 'quark':
      arr.sort((a, b) => {
        const qa = hasQuark(a) ? 1 : 0, qb = hasQuark(b) ? 1 : 0;
        if (qa !== qb) return qb - qa;
        return (b.datetime || '').localeCompare(a.datetime || '');
      });
      break;
    case 'relevance':
      arr.sort((a, b) => {
        const ra = relevanceScore(a, kw), rb = relevanceScore(b, kw);
        if (ra !== rb) return rb - ra;
        return (b.datetime || '').localeCompare(a.datetime || '');
      });
      break;
    case 'quality':
      arr.sort((a, b) => {
        const qa = (a._q || parseQuality(a.title)).score, qb = (b._q || parseQuality(b.title)).score;
        if (qa !== qb) return qb - qa;
        return (b.datetime || '').localeCompare(a.datetime || '');
      });
      break;
    case 'subtitle':
      // 有字幕优先, 其次内封/双语/特效 > 中字 > 无字幕 > 未知
      arr.sort((a, b) => {
        const sa = subtitleRank(a), sb = subtitleRank(b);
        if (sa !== sb) return sb - sa;
        return (b.datetime || '').localeCompare(a.datetime || '');
      });
      break;
    default: // time - 保持 API 返回顺序(已是时间倒序)
      break;
  }
  return arr;
}

// 字幕质量评分(用于排序): 内封 5 > 双语/特效 4 > 中字 3 > 外挂 2 > 未知 1 > 无字幕 0
function subtitleRank(r) {
  const s = r._sub || parseSubtitle(r.title);
  if (!s) return 1;
  if (!s.subtitled) return 0;
  const rank = { inner: 5, dual: 4, effect: 4, zh: 3, ext: 2 };
  return rank[s.type] || 3;
}

// ---- 搜索 ----
async function doSearch(keyword) {
  keyword = (keyword || '').trim();
  if (!keyword) return;
  if (keyword.length > 40) keyword = keyword.slice(0, 40);

  const seq = ++searchSeq;   // 本次请求序号, 防竞态
  allResults = [];
  activeFilter = 'all';
  lastKeyword = keyword;
  visibleCount = RENDER_BATCH;
  renderFilters();
  resultsEl.innerHTML = '';
  setStatus(`<span class="spinner"></span>正在搜索「${esc(keyword)}」...`);

  try {
    // 优先读取 10 分钟内的缓存
    let data = getSearchCache(keyword);
    if (!data) {
      const q = encodeURIComponent(keyword);
      const url = `${API_BASE}/api/search?q=${q}&sort=latest`;
      data = await fetchViaProxy(url);
      if (seq !== searchSeq) return;  // 已被更新的搜索取代, 丢弃本次结果
      if (!data || !data.ok || !data.data) throw new Error('搜索无结果');
      setSearchCache(keyword, data);
    }

    // 去重: 以 标题+链接 去重
    const seen = new Set();
    (data.data.results || []).forEach(r => {
      const key = (r.title || '') + '|' + (r.first_url || '');
      if (seen.has(key)) return;
      seen.add(key);
      allResults.push(r);
    });

    if (seq !== searchSeq) return;  // 二次校验

    if (!allResults.length) {
      setStatus(`未找到「${esc(keyword)}」相关资源,换个关键词试试`);
      resultsEl.innerHTML = emptyHTML('没有找到相关资源');
      return;
    }

    // 预计算: 字幕 + 画质一次性解析, 排序和渲染复用
    allResults.forEach(r => {
      r._sub = parseSubtitle(r.title);
      r._q = parseQuality(r.title);
    });

    setStatus(`找到 ${allResults.length} 条相关资源`);
    document.getElementById('sortBar').style.display = 'flex';
    renderFilters();
    renderResults();
  } catch (e) {
    if (seq !== searchSeq) return;  // 旧请求的错误也忽略
    console.error(e);
    const friendly = friendlyErr(e.message);
    setStatus(`<span class="err">搜索失败:${esc(friendly)}</span> <button class="btn" onclick="doSearch('${esc(lastKeyword.replace(/'/g, "\\'"))}')">↻ 重试</button>`);
    resultsEl.innerHTML = emptyHTML('搜索出错,请重试');
  }
}

// 将原始错误转成用户可读的友好提示
function friendlyErr(msg) {
  const m = msg || '';
  if (/频繁|稍后再试|429|Too Many/i.test(m)) return '源站限流了,请等待 10-30 秒再试';
  if (/所有代理均失败/.test(m)) return '所有代理通道均不可用,可稍后重试或部署专属代理';
  if (/Failed to fetch|fetch failed|NetworkError|AbortError|network/i.test(m)) return '网络连接不稳定,请稍后重试';
  if (/无结果|no result/i.test(m)) return '未找到相关资源';
  return m;
}

function emptyHTML(text) {
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <div>${esc(text)}</div>
  </div>`;
}

function setStatus(html) {
  statusEl.innerHTML = html;
}

// ---- 筛选 ----
function computeCounts() {
  const c = { all: allResults.length, sub: 0 };
  allResults.forEach(r => {
    if (hasSubtitle(r)) c.sub++;
    const types = (r.links || []).map(l => l.type).filter(Boolean);
    types.forEach(t => { c[t] = (c[t] || 0) + 1; });
  });
  return c;
}

function renderFilters() {
  const counts = computeCounts();
  const chips = [['all', '全部', counts.all]];
  if (counts.sub) chips.push(['sub', '📝 有字幕', counts.sub]);
  Object.keys(CLOUD_MAP).forEach(t => {
    if (counts[t]) chips.push([t, CLOUD_MAP[t].name, counts[t]]);
  });
  filtersEl.style.display = 'flex';
  filtersEl.innerHTML = `<span class="count">共 <b>${allResults.length}</b> 条</span>` + chips.map(([k, name, n]) =>
    `<button class="chip ${k === activeFilter ? 'active' : ''}" data-f="${k}">${name}<span class="n">${n}</span></button>`
  ).join('');
}

// ---- 渲染结果 ----
function renderResults() {
  const items = sortResults(allResults.filter(r => {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'sub') return hasSubtitle(r);
    return (r.links || []).some(l => l.type === activeFilter);
  }));

  if (!items.length) {
    resultsEl.innerHTML = emptyHTML('当前筛选下没有结果');
    return;
  }

  const visible = items.slice(0, visibleCount);
  const hasMore = items.length > visibleCount;
  const cardsHTML = mergeSame ? renderGrouped(visible) : visible.map(r => cardHTML(r)).join('');
  resultsEl.innerHTML = cardsHTML +
    (hasMore
      ? `<div class="load-more-wrap"><button class="btn load-more-btn">加载更多 (${visibleCount} / ${items.length})</button></div>`
      : '');
}

// 合并同名多版本: 核心名相同的折叠成一条, 可展开
function renderGrouped(visible) {
  const groups = new Map();
  for (const r of visible) {
    const cn = coreName(r.title);
    if (!groups.has(cn)) groups.set(cn, []);
    groups.get(cn).push(r);
  }

  let html = '';
  for (const [cn, list] of groups) {
    if (list.length === 1) {
      html += cardHTML(list[0]);
    } else if (expandedGroups.has(cn)) {
      html += cardHTML(list[0]);
      html += list.slice(1).map(r => cardHTML(r)).join('');
      html += groupToggle(cn, list.length, true);
    } else {
      html += cardHTML(list[0]);
      html += groupToggle(cn, list.length, false);
    }
  }
  return html;
}

function groupToggle(cn, total, expanded) {
  const n = total - 1;
  return `<div class="group-toggle">
    <button class="btn group-btn" data-group="${esc(cn)}">${expanded ? '收起' : '展开'}同片源 ${n} 个其他版本</button>
  </div>`;
}

function cardHTML(r) {
  const title = r.title || '未知资源';
  const date = (r.date || '').slice(0, 10) || '';
  const type = cloudType((r.links || [])[0] && (r.links[0].type));
  const status = r.status || ((r.links || [])[0] && r.links[0].status) || 'normal';

  const statusHTML = status === 'valid' ? '<span class="status-valid">✓ 有效</span>'
    : status === 'invalid' ? '<span class="status-invalid">✕ 失效</span>'
    : '<span class="status-normal">状态正常</span>';

  const types = [...new Set((r.links || []).map(l => l.type).filter(Boolean))];
  const badges = types.length
    ? types.map(t => { const c = cloudType(t); return `<span class="badge ${c.cls}">${c.name}</span>`; }).join('')
    : `<span class="badge other">${esc(type.name)}</span>`;

  const firstUrl = r.first_url || '';
  const isWash = isWashUrl(firstUrl);
  const isDetail = firstUrl.indexOf('/detail/') === 0;
  const canOpen = /^https?:\/\//.test(firstUrl);
  const firstLinkType = (r.links || [])[0] && (r.links[0].type);
  const resolveLabel = firstLinkType === 'quark' ? '解析夸克链接' : `解析${cloudType(firstLinkType).name}`;

  // 字幕标签 (优先用预计算的 _sub)
  const ps = r._sub || parseSubtitle(title);
  const subTag = ps ? `<span class="sub-tag ${ps.cls}">${ps.label}</span>` : '';

  // 质量标签 (优先用预计算的 _q)
  const pq = r._q || parseQuality(title);
  let qualityTags = '';
  if (pq.res) qualityTags += `<span class="quality-tag ${pq.resCls}">${pq.res}</span>`;
  if (pq.sizeStr) qualityTags += `<span class="quality-tag size">${pq.sizeStr}</span>`;

  let actions = '';
  const dataKey = isWash ? firstUrl.split('t=')[1] : firstUrl;
  if (isWash || isDetail) {
    const btnKind = isWash ? 'resolve-btn' : 'detail-btn';
    actions += `<button class="btn primary ${btnKind}" data-t="${esc(dataKey)}" data-title="${esc(title)}" data-label="${esc(resolveLabel)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>${resolveLabel}
    </button>`;
  } else if (canOpen) {
    actions += `<a class="btn primary" href="${esc(firstUrl)}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/>
      </svg>打开链接
    </a>`;
    actions += copyBtn(firstUrl, '复制链接');
  } else {
    actions += `<a class="btn" href="${API_BASE}${esc(firstUrl)}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/>
      </svg>查看详情
    </a>`;
  }

  return `
  <div class="card" data-title="${esc(title)}">
    <div class="card-top">
      <div class="card-title">${esc(title)}</div>
      <span class="badge ${type.cls}">${esc(type.name)}</span>
    </div>
    <div class="card-meta">
      <span>${date || '时间未知'}</span>
      ${subTag ? `<span class="dot"></span>${subTag}` : ''}
      ${qualityTags ? `<span class="dot"></span>${qualityTags}` : ''}
      ${badges ? `<span class="dot"></span>${badges}` : ''}
      <span class="dot"></span>${statusHTML}
    </div>
    <div class="card-actions">${actions}</div>
    <div class="link-result" id="lr-${esc(dataKey.replace(/[^a-zA-Z0-9-]/g,''))}"></div>
  </div>`;
}

function copyBtn(url, label) {
  return `<button class="btn copy-btn" data-copy="${esc(url)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
    </svg>${label}
  </button>`;
}

// ---- 解析夸克链接 (wash) ----
async function resolveLink(t, title) {
  const box = document.getElementById('lr-' + (t || '').replace(/[^a-zA-Z0-9-]/g, ''));
  if (!box) return;

  if (linkCache[t]) {
    showResolved(box, linkCache[t], title);
    return;
  }
  if (resolvingMap[t]) {
    try {
      const { url: u, redirected } = await resolvingMap[t];
      showResolved(box, u, title, redirected);
    } catch (e) { box.innerHTML = errHTML(e.message); }
    return;
  }

  const url = `${API_BASE}/api/wash?t=${encodeURIComponent(t)}`;
  box.innerHTML = `<div style="color:var(--text-dim);font-size:13px"><span class="spinner" style="width:14px;height:14px;vertical-align:-2px"></span>正在解析链接,请稍候...</div>`;
  box.classList.add('show');

  // 解析请求放入全局队列, 串行 + 间隔, 避免触发源站限流(429)
  const p = enqueueWash(async () => {
    let data;
    try {
      data = await fetchViaProxy(url);
    } catch (e) {
      // 429 限流: 等待后自动重试一次
      if (e.status === 429) {
        await new Promise(r => setTimeout(r, 4000));
        data = await fetchViaProxy(url);
      } else {
        throw e;
      }
    }
    if (!data) throw new Error('解析失败:无响应');
    if (data.ok && data.raw_url) return { url: data.raw_url };
    if (data.redirect) return { url: data.redirect, redirected: true };
    throw new Error(data.msg || '链接无效或已过期');
  });

  resolvingMap[t] = p;
  try {
    const { url: raw, redirected } = await p;
    linkCache[t] = raw;
    showResolved(box, raw, title, redirected);
  } catch (e) {
    console.error(e);
    box.innerHTML = errHTML(e.message);
  }
}

// 备用解析: 从详情页 /detail/xxx 直接提取夸克链接 (不受 wash 限流影响)
async function resolveDetail(detailPath, title) {
  const box = document.getElementById('lr-' + (detailPath || '').replace(/[^a-zA-Z0-9-]/g, ''));
  if (!box) return;

  if (linkCache[detailPath]) {
    showResolved(box, linkCache[detailPath], title);
    return;
  }

  const url = `${API_BASE}${detailPath}`;
  box.innerHTML = `<div style="color:var(--text-dim);font-size:13px"><span class="spinner" style="width:14px;height:14px;vertical-align:-2px"></span>正在解析链接,请稍候...</div>`;
  box.classList.add('show');

  const p = enqueueWash(async () => {
    const html = await fetchViaProxy(url, { asText: true });
    const urls = extractLinksFromDetail(html);
    if (!urls.length) throw new Error('详情页未找到可用的网盘链接');
    return { url: urls[0] };
  });

  try {
    const { url: raw } = await p;
    linkCache[detailPath] = raw;
    showResolved(box, raw, title);
  } catch (e) {
    console.error(e);
    box.innerHTML = errHTML(e.message);
  }
}

function showResolved(box, rawUrl, title, redirected) {
  const host = (rawUrl.match(/^https?:\/\/([^\/]+)/) || [])[1] || '';
  const isQuark = host.includes('pan.quark.cn');
  const diskName = isQuark ? '夸克网盘'
    : host.includes('pan.baidu.com') ? '百度网盘'
    : host.includes('pan.xunlei.com') ? '迅雷网盘'
    : host.includes('drive.uc.cn') ? 'UC网盘'
    : host.includes('aliyundrive.com') || host.includes('alipan.com') ? '阿里云盘'
    : '网盘';
  const openLabel = isQuark ? '打开夸克' : '打开链接';

  box.innerHTML = `
    <div class="lbl">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>${esc(diskName)}链接${redirected ? '(已重定向)' : ''}
    </div>
    <div class="link-row">
      <a href="${esc(rawUrl)}" target="_blank" rel="noopener">${esc(rawUrl)}</a>
      <button class="btn copy-btn" data-copy="${esc(rawUrl)}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>复制
      </button>
      <a class="btn primary" href="${esc(rawUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/>
        </svg>${openLabel}
      </a>
    </div>
    <div class="tip">提示: 链接来自公开网络资源,打开后转存到自己的网盘即可观看</div>`;
}

function errHTML(msg) {
  const m = friendlyErr(msg || '解析失败,链接可能已失效或网络异常');
  return `<div class="lbl" style="color:var(--red)">${esc(m)}</div>`;
}

// ---- 事件绑定 ----
function bindEvents() {
  searchBtn.addEventListener('click', () => doSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInput.value); });

  filtersEl.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    activeFilter = chip.dataset.f;
    visibleCount = RENDER_BATCH;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    renderResults();
    scrollToResults();
  });

  // 排序切换 + 合并同名开关
  document.getElementById('sortBar').addEventListener('click', e => {
    // 合并同名开关(独立于排序)
    if (e.target.closest('#mergeBtn')) {
      mergeSame = !mergeSame;
      const mb = document.getElementById('mergeBtn');
      mb.classList.toggle('active', mergeSame);
      renderResults();
      return;
    }
    const btn = e.target.closest('.sort-btn');
    if (!btn) return;
    activeSort = btn.dataset.sort;
    visibleCount = RENDER_BATCH;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderResults();
    scrollToResults();
  });

  resultsEl.addEventListener('click', async e => {
    // 展开/收起同片源版本
    const gb = e.target.closest('.group-btn');
    if (gb) {
      const cn = gb.dataset.group;
      if (expandedGroups.has(cn)) expandedGroups.delete(cn);
      else expandedGroups.add(cn);
      renderResults();
      return;
    }
    // 加载更多
    if (e.target.closest('.load-more-btn')) {
      visibleCount += RENDER_BATCH;
      renderResults();
      return;
    }
    // 复制
    const copyBtnEl = e.target.closest('.copy-btn');
    if (copyBtnEl) {
      const text = copyBtnEl.dataset.copy;
      try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板 ✓');
      } catch (err) {
        // 降级
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        toast('已复制到剪贴板 ✓');
      }
      return;
    }
    // 解析 (wash)
    const rb = e.target.closest('.resolve-btn');
    if (rb) {
      const origLabel = rb.dataset.label || '解析链接';
      rb.disabled = true;
      rb.innerHTML = '<span class="spin"></span>解析中...';
      try {
        await resolveLink(rb.dataset.t, rb.dataset.title);
      } finally {
        rb.disabled = false;
        rb.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>${origLabel}`;
      }
      return;
    }
    // 解析 (详情页备用通道)
    const db = e.target.closest('.detail-btn');
    if (db) {
      const origLabel = db.dataset.label || '解析链接';
      db.disabled = true;
      db.innerHTML = '<span class="spin"></span>解析中...';
      try {
        await resolveDetail(db.dataset.t, db.dataset.title);
      } finally {
        db.disabled = false;
        db.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>${origLabel}`;
      }
    }
  });

  // 返回顶部
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 400);
  });
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

function scrollToResults() {
  const y = resultsEl.offsetTop;
  window.scrollTo({ top: Math.max(0, y - 120), behavior: 'smooth' });
}

// ---- 初始化 ----
function init() {
  bindEvents();
  // 页面初始为空, 等待用户输入搜索
}
init();
</script>

</html>
